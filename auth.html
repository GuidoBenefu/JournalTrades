<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Journal Trading</title>
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="site">

  <header class="site-nav">
    <a class="brand" href="index.html"><img class="brand-logo" src="img/logo.png" alt="Journal Trading"></a>
    <div class="nav-right">
      <button type="button" class="theme-toggle" data-theme-toggle></button>
      <div class="links"><a class="btn-link ghost" href="index.html">Volver al inicio</a></div>
    </div>
  </header>

  <div class="auth-wrap">
    <form class="auth-card" id="authForm" novalidate>
      <h1 id="authTitle"></h1>
      <p class="muted" id="authSubtitle"></p>

      <div class="auth-tabs">
        <button type="button" data-mode="login">Iniciar sesión</button>
        <button type="button" data-mode="register">Crear cuenta</button>
      </div>

      <div class="field" id="planField">
        <label>Plan</label>
        <div class="plan-pick">
          <button type="button" class="plan-opt" data-plan="trial"><div class="t">Prueba gratis</div><div class="s">7 días, sin tarjeta</div></button>
          <button type="button" class="plan-opt" data-plan="pro"><div class="t">Pro</div><div class="s">Desde USD 11,99 / mes</div></button>
        </div>
      </div>

      <div class="field" id="billingField">
        <label>Forma de pago</label>
        <div class="plan-pick">
          <button type="button" class="plan-opt billing-opt" data-billing="monthly"><div class="t">Mensual</div><div class="s" id="monthlyPrice"></div></button>
          <button type="button" class="plan-opt billing-opt" data-billing="annual"><div class="t">Anual <span class="save-pill">-20%</span></div><div class="s" id="annualPrice"></div></button>
        </div>
        <div class="price-note" id="billingNote"></div>
      </div>

      <div class="field" id="nameField">
        <label for="nameInput">Nombre</label>
        <input type="text" id="nameInput" autocomplete="name">
      </div>
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" autocomplete="email">
      </div>
      <div class="field">
        <label for="passwordInput">Contraseña</label>
        <input type="password" id="passwordInput">
      </div>

      <button type="submit" class="primary submit" id="submitBtn"></button>
      <div class="form-error" id="formError"></div>
      <div class="form-note" id="formNote"></div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  if(JournalAuth.currentUser()) location.replace('app.html');

  const params = new URLSearchParams(location.search);
  let mode = params.get('mode') === 'register' ? 'register' : 'login';
  let plan = params.get('plan') === 'pro' ? 'pro' : 'trial';
  let billing = params.get('billing') === 'annual' ? 'annual' : 'monthly';
  const pricing = JournalAuth.PRO_PRICING;
  document.getElementById('monthlyPrice').textContent = JournalAuth.formatUSD(pricing.monthly.price) + ' / mes';
  document.getElementById('annualPrice').textContent = JournalAuth.formatUSD(pricing.annual.price) + ' / año';

  function render(){
    const reg = mode === 'register';
    document.getElementById('authTitle').textContent = reg ? 'Creá tu cuenta' : 'Bienvenido de nuevo';
    document.getElementById('authSubtitle').textContent = reg
      ? (plan === 'pro' ? 'Empezá con el plan Pro.' : 'Empezá tu prueba gratis de 7 días.')
      : 'Ingresá para ir a tu journal.';
    document.querySelectorAll('.auth-tabs button').forEach(b=> b.classList.toggle('active', b.dataset.mode === mode));
    document.querySelectorAll('.plan-opt[data-plan]').forEach(b=> b.classList.toggle('active', b.dataset.plan === plan));
    document.querySelectorAll('.billing-opt').forEach(b=> b.classList.toggle('active', b.dataset.billing === billing));
    document.getElementById('planField').style.display = reg ? '' : 'none';
    document.getElementById('billingField').style.display = reg && plan === 'pro' ? '' : 'none';
    document.getElementById('billingNote').innerHTML = billing === 'annual'
      ? '<strong>20% de descuento pagando anual.</strong> Equivale a ' + JournalAuth.formatUSD(pricing.annual.perMonth) + '/mes: ahorrás ' + JournalAuth.formatUSD(pricing.annual.savings) + ' al año.'
      : 'Pagando anual tenés un 20% de descuento: ' + JournalAuth.formatUSD(pricing.annual.price) + ' / año.';
    document.getElementById('nameField').style.display = reg ? '' : 'none';
    document.getElementById('passwordInput').autocomplete = reg ? 'new-password' : 'current-password';
    document.getElementById('submitBtn').textContent = reg
      ? (plan === 'pro' ? 'Crear cuenta Pro ' + (billing === 'annual' ? 'anual' : 'mensual') : 'Empezar prueba gratis')
      : 'Iniciar sesión';
    document.getElementById('formNote').textContent = reg && plan === 'pro'
      ? 'Los pagos todavía no están integrados: el plan Pro se activa sin cobro.'
      : '';
    document.getElementById('formError').style.display = 'none';
  }

  document.querySelectorAll('.auth-tabs button').forEach(b=> b.addEventListener('click', ()=>{ mode = b.dataset.mode; render(); }));
  document.querySelectorAll('.plan-opt[data-plan]').forEach(b=> b.addEventListener('click', ()=>{ plan = b.dataset.plan; render(); }));
  document.querySelectorAll('.billing-opt').forEach(b=> b.addEventListener('click', ()=>{ billing = b.dataset.billing; render(); }));

  document.getElementById('authForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const err = document.getElementById('formError');
    err.style.display = 'none';
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    try{
      if(mode === 'register'){
        await JournalAuth.register({name: document.getElementById('nameInput').value, email, password, plan, billing});
      } else {
        await JournalAuth.login({email, password});
      }
      location.href = 'app.html';
    }catch(ex){
      err.textContent = ex.message;
      err.style.display = 'block';
    }
  });

  render();
</script>
</body>
</html>
